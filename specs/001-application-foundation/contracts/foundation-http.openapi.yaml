openapi: 3.1.0
info:
  title: Songhealth Foundation Operational HTTP Contract
  version: 0.1.0
  description: >-
    Minimal liveness and readiness interfaces for the Application Foundation Delivery. These are
    operational contracts, not Product APIs, and expose no secret or infrastructure detail.
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Confirm that the application process can handle HTTP work
      tags: [operations]
      responses:
        "200":
          description: Application process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
              examples:
                alive:
                  value:
                    status: alive
        "500":
          $ref: "#/components/responses/SafeOperationalFailure"
  /health/ready:
    get:
      operationId: getReadiness
      summary: Confirm that all required foundation dependencies are ready
      tags: [operations]
      responses:
        "200":
          description: Configuration, application, database, and migration status are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              examples:
                ready:
                  value:
                    status: ready
                    components:
                      - name: application
                        status: ready
                      - name: database
                        status: ready
        "503":
          description: At least one required readiness contract is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              examples:
                databaseUnavailable:
                  value:
                    status: not-ready
                    components:
                      - name: application
                        status: ready
                      - name: database
                        status: not-ready
                        diagnostic:
                          reasonCode: DATABASE_UNAVAILABLE
                          diagnosticScope: verification
                          component: database
                          remediation: CHECK_DATABASE
        "500":
          $ref: "#/components/responses/SafeOperationalFailure"
components:
  responses:
    SafeOperationalFailure:
      description: A safe operational failure without internal exception or protected values
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SafeDiagnostic"
  schemas:
    Liveness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: alive
    Readiness:
      type: object
      additionalProperties: false
      required: [status, components]
      allOf:
        - if:
            properties:
              status:
                const: ready
          then:
            properties:
              components:
                items:
                  properties:
                    status:
                      const: ready
        - if:
            properties:
              status:
                const: not-ready
          then:
            properties:
              components:
                contains:
                  type: object
                  required: [status]
                  properties:
                    status:
                      const: not-ready
                minContains: 1
      properties:
        status:
          type: string
          enum: [ready, not-ready]
        components:
          type: array
          minItems: 2
          maxItems: 2
          allOf:
            - contains:
                type: object
                required: [name]
                properties:
                  name:
                    const: application
              minContains: 1
              maxContains: 1
            - contains:
                type: object
                required: [name]
                properties:
                  name:
                    const: database
              minContains: 1
              maxContains: 1
          items:
            $ref: "#/components/schemas/ComponentReadiness"
    ComponentReadiness:
      type: object
      additionalProperties: false
      required: [name, status]
      allOf:
        - if:
            properties:
              status:
                const: not-ready
          then:
            required: [diagnostic]
          else:
            not:
              required: [diagnostic]
      properties:
        name:
          type: string
          enum: [application, database]
        status:
          type: string
          enum: [ready, not-ready]
        diagnostic:
          $ref: "#/components/schemas/SafeDiagnostic"
    SafeDiagnostic:
      type: object
      additionalProperties: false
      required: [reasonCode, diagnosticScope, component, remediation]
      properties:
        reasonCode:
          type: string
          enum:
            - OPERATIONAL_FAILURE
            - BUILD_FAILED
            - STARTUP_FAILED
            - CONFIG_MISSING
            - CONFIG_EMPTY
            - CONFIG_MALFORMED
            - CONFIG_UNSUPPORTED
            - CONFIG_OUT_OF_RANGE
            - CONFIG_IDENTITY_CONFLICT
            - CONFIG_REJECTION_NOT_ENFORCED
            - DATABASE_UNAVAILABLE
            - MIGRATION_FAILED
            - MIGRATIONS_PENDING
            - MIGRATION_STATUS_FAILED
            - LIVENESS_FAILED
            - READINESS_FAILED
            - ISOLATION_FAILED
            - PROXY_CONTRACT_FAILED
            - ROUTE_UNREACHABLE
            - OPERATION_INTERRUPTED
            - RESOURCE_OWNERSHIP_UNPROVEN
            - RESOURCE_INVENTORY_CHANGED
            - DATA_INTEGRITY_UNPROVEN
            - DATA_RECONSTRUCTIBILITY_UNPROVEN
            - NON_DESTRUCTIVE_REPAIR_UNAVAILABLE
            - MANUAL_REVIEW_REQUIRED
            - PREREQUISITE_FAILED
            - CLEANUP_FAILED
            - REPORT_INVALID
            - REPORT_EMISSION_FAILED
            - SECRET_SCANNER_FAILED
            - COMMITTED_SECRET_DETECTED
            - DEPENDENCY_FINDING_UNREVIEWED
            - DEPENDENCY_FINDING_BLOCKING
            - DEPENDENCY_EXCEPTION_EXPIRED
            - DEPENDENCY_EVIDENCE_MISMATCH
            - ASVS_EVIDENCE_INCOMPLETE
        diagnosticScope:
          type: string
          enum: [foundation, daily, verification]
        component:
          type: string
          enum:
            - orchestration
            - configuration
            - application
            - database
            - migration
            - proxy
            - public
            - admin
            - reporting
            - cleanup
            - security
        configurationKey:
          type: string
          enum:
            - APP_ENVIRONMENT
            - RUNTIME_PROFILE
            - APP_HOST
            - APP_PORT
            - PUBLIC_ORIGIN
            - DATABASE_URL
            - DATABASE_POOL_MAX
            - PROXY_POLICY
            - LOG_LEVEL
            - FIXTURE_PROVENANCE
        remediation:
          type: string
          enum:
            - CHECK_PREREQUISITES
            - FIX_CONFIGURATION
            - CHECK_DATABASE
            - RUN_MIGRATION
            - INSPECT_OWNERSHIP
            - RETRY_SAFE_OPERATION
            - RUN_CONFIRMED_RECOVERY
            - RUN_CONFIRMED_RESET
            - REVIEW_MANUALLY
            - REVIEW_SECURITY_EVIDENCE
            - NONE
