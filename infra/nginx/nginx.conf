# Provisional Verification one-hop proxy configuration (FR-009–FR-011; Research Decisions 3, 6
# and 8; plan.md §§Runtime composition and Configuration and startup; Operations Contract
# §§Safe diagnostic contract and Operation-target ownership and isolation;
# specs/001-application-foundation/tasks.md T047).
#
# This file configures ONLY the Nginx service already declared by the accepted
# infra/compose.verification.yaml (T046). It changes no topology, publishes no port of its own,
# and reaches exactly one destination: the internal application listener. Nginx listens on the
# in-container port 80 that T046 already publishes loopback-only as 127.0.0.1:8080, so the proxy
# remains the single host-reachable surface and the application and database ports stay internal
# to their Compose networks (contract §Operation-target ownership and isolation). No second
# listen port, virtual host, or upstream destination is declared here, so nothing in this file
# can widen that exposure.
#
# PROVISIONAL CHOICE (FR-015): this is the local Verification proxy behavior only. It is not a
# Production reverse-proxy or hosted-trust decision; hosted proxy trust stays unset until the
# real Bangmod/Plesk chain is inspected (Research Decision 6), and nothing here claims parity
# with that environment.
#
# ONE BOUNDED TRUSTED-HOP CONTRACT (Decision 6, "Verification trusts exactly one proxy hop"):
# every request the application receives through this proxy carries exactly one forwarded
# identity, derived from what the trusted hop itself observed — never from anything the client
# sent. Nginx `proxy_set_header` REPLACES an inbound header rather than appending to it, so each
# directive below overwrites any client-supplied value outright. `$proxy_add_x_forwarded_for`
# is deliberately NOT used anywhere: it would append the client's spoofed chain and create the
# multi-hop trust this contract forbids. Client-supplied `Forwarded`, `X-Real-IP`,
# `X-Forwarded-Server`, `X-Forwarded-Scheme`, `X-Original-URL`, and `X-Rewrite-URL` are cleared
# to empty, and an empty value is omitted entirely by Nginx — so no spoofable forwarding or
# identity metadata survives the hop, and none is relayed as an extra hop.
#
# BOUNDED, NONDISCLOSING LOGGING (§Safe diagnostic contract), split by outcome:
#   - Successful responses (2xx/3xx) go to the bounded access log, which records only peer
#     address, timestamp, method, path, status, bytes, and duration. It deliberately omits
#     `$request` and `$request_uri` (both carry the query string, which is query data the log
#     must not retain), every `$http_*` request-header variable (client-supplied values,
#     including any spoofed forwarded metadata), and every `$upstream_*` variable (these name
#     the internal `songhealth-app:3000` listener and raw upstream outcomes).
#   - Every failure (4xx/5xx) goes to a separate stream in which each entry is EXACTLY ONE
#     closed `verification` SafeDiagnostic — allowlisted reason code, scope, component, and
#     remediation and nothing else. No peer address, timestamp, method, path, status, size, or
#     duration is written for a failure, because §Safe diagnostic contract requires failure
#     units on surfaced proxy logs to be the closed shape with no additional fields. That
#     stream is directed at /dev/stderr, the channel the image already surfaces, so failures
#     are observable rather than parked in an unmounted file.
# The error log is held at `crit` so upstream connection failures — which Nginx would otherwise
# record together with the internal upstream hostname and the full request line — are not
# written. Raw proxy failure text is consumed and mapped by the orchestration adapter, never
# passed through as ordinary output.

user  nginx;
worker_processes  auto;

# See the logging note above: `crit` is the highest level that still records worker and startup
# failures while suppressing the `error`-level upstream diagnostics that name internal hosts.
error_log  /var/log/nginx/error.log crit;

pid  /var/run/nginx.pid;

events {
    worker_connections  512;
}

http {
    # No static content is served from this proxy — every response body either arrives from the
    # internal application (which sets its own Content-Type) or is one of the closed diagnostics
    # below. mime.types is therefore deliberately not included: it would type those generated
    # bodies by file extension (`/x.js` answering as application/javascript), leaving the closed
    # surface inconsistent, whereas a single default keeps it uniform.
    default_type  application/json;

    # The bounded success format defined above. `escape=json` prevents a crafted path from
    # injecting control characters or quotes into the log line. `/var/log/nginx/access.log` is
    # the standard image path, already symlinked to the container's stdout, so the disposable
    # Verification container owns the whole log lifecycle and nothing outlives the run.
    log_format  bounded  escape=json
                '$remote_addr $time_iso8601 "$request_method $uri" '
                '$status $body_bytes_sent $request_time';
    access_log  /var/log/nginx/access.log  bounded  if=$log_success;

    # The closed failure stream defined above: one exact SafeDiagnostic per failed response.
    log_format  diagnostic  escape=json
                '{"reasonCode":"$failure_reason","diagnosticScope":"verification",'
                '"component":"proxy","remediation":"$failure_remediation"}';
    access_log  /dev/stderr  diagnostic  if=$log_failure;

    # No Nginx version or build detail on responses or error pages.
    server_tokens  off;

    sendfile          on;
    tcp_nopush        on;
    keepalive_timeout 15s;

    # Bounded request surface: limited header count/size and bounded header, body, and response
    # timeouts, so a client cannot hold the proxy open or push unbounded header data at it.
    client_header_timeout       10s;
    client_body_timeout         10s;
    send_timeout                10s;
    large_client_header_buffers  4 8k;
    client_max_body_size         1m;

    # ------------------------------------------------------------------
    # Which log stream a response belongs to (§Safe diagnostic contract):
    # 2xx/3xx are successes recorded in the bounded access log; every 4xx/5xx
    # is a failure recorded as exactly one closed diagnostic.
    # ------------------------------------------------------------------
    map $status $log_success {
        ~^[23]   1;
        default  0;
    }

    map $status $log_failure {
        ~^[45]   1;
        default  0;
    }

    # The closed failure values, chosen only from the allowlisted reason-code and remediation
    # sets. The boundary-specific outcomes map to the route/proxy contract; any other failure
    # status — including one produced by the application behind this proxy — carries the generic
    # operational-failure code rather than guessing a more specific meaning this proxy cannot
    # know. `component` is the fixed `proxy` value in the format itself.
    map $status $failure_reason {
        404      ROUTE_UNREACHABLE;
        502      ROUTE_UNREACHABLE;
        504      ROUTE_UNREACHABLE;
        default  OPERATIONAL_FAILURE;
    }

    map $status $failure_remediation {
        404      NONE;
        default  CHECK_PREREQUISITES;
    }

    server {
        # The only listener this proxy opens — the port T046 publishes loopback-only.
        listen       80;
        server_name  _;

        # ------------------------------------------------------------------
        # The single internal destination (FR-009 isolation). `proxy_pass` is
        # repeated verbatim in each location below because Nginx only accepts
        # it in a location, and it carries no URI part so the application
        # receives the request URI exactly as the client sent it. Resolving
        # the name at configuration load means Nginx fails closed at startup
        # when the application container is absent, which matches the T046
        # note that scripts/foundation-operations.mjs owns explicit
        # sequencing.
        # ------------------------------------------------------------------
        proxy_http_version  1.1;

        # Reveal nothing about the internal listener on redirect. Nginx's default
        # `proxy_redirect default` rewrites any upstream absolute Location that carries the
        # internal `songhealth-app:3000` origin into the externally requested one, and is
        # relied on rather than redeclared — redeclaring it here is invalid once `proxy_pass`
        # lives in the locations. `absolute_redirect off` additionally makes any Location
        # Nginx itself emits relative, so a wrong published-port absolute URL is never
        # synthesized behind the 8080-to-80 publication.
        absolute_redirect   off;

        proxy_connect_timeout  5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    15s;

        # Strip upstream framework disclosure headers before the response leaves the boundary.
        proxy_hide_header  X-Powered-By;

        # ------------------------------------------------------------------
        # One bounded trusted-hop contract. These directives live at server
        # level and are inherited whole by the locations below: Nginx
        # inherits `proxy_set_header` from the enclosing level only when the
        # location declares none of its own, so keeping every location free
        # of `proxy_set_header` is what guarantees the application can never
        # observe a partially-replaced forwarded identity.
        # ------------------------------------------------------------------
        proxy_set_header  Host              $host;
        proxy_set_header  X-Forwarded-For   $remote_addr;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_set_header  X-Forwarded-Host  $host;

        # Client-supplied forwarding and identity metadata is dropped, never relayed.
        proxy_set_header  Forwarded          "";
        proxy_set_header  X-Real-IP          "";
        proxy_set_header  X-Forwarded-Server "";
        proxy_set_header  X-Forwarded-Scheme "";
        proxy_set_header  X-Original-URL     "";
        proxy_set_header  X-Rewrite-URL      "";

        # ------------------------------------------------------------------
        # Closed failure surfaces (FR-007/FR-010). Nginx's own gateway failures
        # would otherwise answer with a raw default error page. Each is replaced
        # by exactly one closed `verification` SafeDiagnostic built only from
        # allowlisted reason-code, scope, component, and remediation values.
        # `proxy_intercept_errors` stays off so upstream-originated statuses —
        # including the documented 503 not-ready readiness response — reach the
        # client untouched; only failures Nginx itself generates are remapped.
        # ------------------------------------------------------------------
        error_page  502 = @upstream_unavailable;
        error_page  504 = @upstream_timeout;

        location @upstream_unavailable {
            internal;
            default_type  application/json;
            return  502  '{"reasonCode":"ROUTE_UNREACHABLE","diagnosticScope":"verification","component":"proxy","remediation":"CHECK_PREREQUISITES"}';
        }

        location @upstream_timeout {
            internal;
            default_type  application/json;
            return  504  '{"reasonCode":"ROUTE_UNREACHABLE","diagnosticScope":"verification","component":"proxy","remediation":"CHECK_PREREQUISITES"}';
        }

        # ------------------------------------------------------------------
        # The operational server routes from contracts/foundation-http.openapi.yaml,
        # kept as exact matches so the two documented contract paths are explicit
        # and can never be shadowed by a later rule.
        # ------------------------------------------------------------------
        location = /health/live {
            proxy_pass  http://songhealth-app:3000;
        }

        location = /health/ready {
            proxy_pass  http://songhealth-app:3000;
        }

        # ------------------------------------------------------------------
        # The application-owned surface (FR-009; Research Decisions 3 and 8).
        # The single release listener serves Admin assets and fallback, Public
        # assets, and the remaining Public requests through the React Router
        # server build, and Decision 8 verifies Admin assets through this Nginx
        # hop. This proxy therefore forwards the Public root, the Public build
        # assets, every remaining Public request, the `/admin/` route, and the
        # Admin build assets to that one listener, which owns routing,
        # authorization, and refusal inside those surfaces. Adding no further
        # destination and no further listener, nothing here widens T046's
        # loopback-only exposure.
        # ------------------------------------------------------------------
        location / {
            proxy_pass  http://songhealth-app:3000;
        }
    }
}
