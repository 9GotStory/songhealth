# Provisional Development operation-target database manifest (FR-004–FR-005, FR-008, FR-015;
# Research Decisions 4–5). MySQL 8.4 LTS is a provisional local engine choice only — not a
# Production vendor/version/collation decision and no Production parity claim. The image is
# pinned by an immutable digest resolving specifically to mysql:8.4; floating mysql:lts or
# mysql:latest is prohibited because the lts tag may move to another major. The Verification
# operation target uses its own separate manifest; this manifest declares only the Development
# database and its persistent volume. Checkout-scoped Compose project names are derived by
# scripts/foundation-operations.mjs, so no fixed project/container/volume/network name is set
# here (fixed global names would collide across checkouts). The checkout ownership label is
# likewise runtime-supplied: SONGHEALTH_CHECKOUT_ID is the required, stable checkout-scoped
# input set by scripts/foundation-operations.mjs alongside the project name, applied
# identically to the service, network, and volume so each checkout presents its own ownership
# value, and rendering fails when it is absent. Credentials are committed
# non-secret Development-only placeholders aligned with .env.development.example; they are
# never Production configuration.
services:
  database:
    image: mysql@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    command:
      - --character-set-server=utf8mb4
      - --default-storage-engine=innodb
    environment:
      MYSQL_DATABASE: songhealth_development
      MYSQL_USER: songhealth_dev
      MYSQL_PASSWORD: dev-only-placeholder
      MYSQL_ROOT_PASSWORD: dev-only-placeholder-root
    ports:
      # Loopback-only publication: the Development Data Store is never reachable off-host.
      - "127.0.0.1:3306:3306"
    volumes:
      - database-data:/var/lib/mysql
    networks:
      - database
    labels:
      org.songhealth.foundation.delivery: "001-application-foundation"
      org.songhealth.foundation.checkout: "${SONGHEALTH_CHECKOUT_ID:?required checkout ownership input is absent}"
      org.songhealth.foundation.environment: development
      org.songhealth.foundation.runtime-profile: daily
      org.songhealth.foundation.operation-target: development
      org.songhealth.foundation.resource: development.database
      org.songhealth.foundation.ownership-schema: v1

networks:
  database:
    driver: bridge
    labels:
      org.songhealth.foundation.delivery: "001-application-foundation"
      org.songhealth.foundation.checkout: "${SONGHEALTH_CHECKOUT_ID:?required checkout ownership input is absent}"
      org.songhealth.foundation.environment: development
      org.songhealth.foundation.runtime-profile: daily
      org.songhealth.foundation.operation-target: development
      org.songhealth.foundation.resource: development.network
      org.songhealth.foundation.ownership-schema: v1

volumes:
  # Persistent across routine stop/restart; changed only by explicit migration or reset.
  database-data:
    labels:
      org.songhealth.foundation.delivery: "001-application-foundation"
      org.songhealth.foundation.checkout: "${SONGHEALTH_CHECKOUT_ID:?required checkout ownership input is absent}"
      org.songhealth.foundation.environment: development
      org.songhealth.foundation.runtime-profile: daily
      org.songhealth.foundation.operation-target: development
      org.songhealth.foundation.resource: development.database-volume
      org.songhealth.foundation.ownership-schema: v1
