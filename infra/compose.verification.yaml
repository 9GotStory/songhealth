# Provisional Verification operation-target topology manifest (FR-005, FR-008–FR-009, FR-015;
# Research Decisions 4–5; Data Model §Data Store). This manifest declares the isolated,
# disposable Production-like Verification topology only: the Nginx proxy, the production-built
# application, and an independent MySQL-compatible Data Store. It shares nothing with
# infra/compose.development.yaml — different credentials, database, named volume, networks, and
# a checkout-scoped Compose project — so a Verification run never reads, writes, stops, or
# depends on Development resources (contract §Operation-target ownership and isolation).
#
# PROVISIONAL CHOICE (FR-015): MySQL 8.4 LTS and Nginx 1.30 are provisional local Verification
# engine choices pinned by immutable digests, exactly like the Development database image. They
# are NOT Production vendor/version decisions and establish no parity with the future Bangmod /
# Plesk hosting runtime, which stays evidence-dependent until that environment is inspected.
# The database digest resolves specifically to mysql:8.4 (never a floating `mysql:lts` /
# `mysql:latest`, which may move to another major); the proxy digest resolves specifically to
# `nginx:stable` (1.30.4).
#
# Only the Nginx proxy is published to the host, and loopback-only at that: the application and
# database services declare `expose` alone, so neither port is reachable off-host or from outside
# this Compose project. Verification is not a fourth environment (FR-008), so the ownership
# labels keep `environment=development` and distinguish the target through
# `runtime-profile=verification` and `operation-target=verification` instead.
#
# The disposable named volume below follows the Data Model `clean-run` persistence policy for
# Verification: each run starts from an absent clean inventory and removes only these exact
# resources afterward. It is never the Development volume, which persists across routine
# stop/restart.
#
# No fixed project, container, volume, or network name is set here: checkout-scoped Compose
# project names are derived by scripts/foundation-operations.mjs, and fixed global names would
# collide across checkouts. The checkout ownership label is likewise runtime-supplied:
# SONGHEALTH_CHECKOUT_ID is the required, stable checkout-scoped input set alongside the project
# name, applied identically to every service, network, and volume so each checkout presents its
# own ownership value, and rendering fails when it is absent.
#
# Committed credentials are non-secret Verification-only placeholders aligned with
# .env.verification.example and are never Production configuration. The application service
# deliberately declares no `environment` and no committed configuration: runtime configuration
# is supplied by the orchestration boundary from the ignored .env.verification.local file, and
# startup must fail closed on missing or invalid configuration (FR-006) rather than inherit
# committed defaults. No `depends_on` ordering or HEALTHCHECK is declared here — the accepted
# infra/Containerfile defines no healthcheck because the release listener task is not yet
# implemented, and scripts/foundation-operations.mjs owns explicit sequencing and polling
# (Research Decision 5).
services:
  # The single host-published entry point (T047 owns its configuration and forwarding rules).
  nginx:
    image: docker.io/library/nginx@sha256:09cc2702709e6388d979d8030e3ab4eb1ceb699b2dced26d7543e872a822e823
    ports:
      # Loopback-only publication: the only host-reachable surface of this topology.
      - "127.0.0.1:8080:80"
    networks:
      - proxy
    labels:
      org.songhealth.foundation.delivery: "001-application-foundation"
      org.songhealth.foundation.checkout: "${SONGHEALTH_CHECKOUT_ID:?required checkout ownership input is absent}"
      org.songhealth.foundation.environment: development
      org.songhealth.foundation.runtime-profile: verification
      org.songhealth.foundation.operation-target: verification
      org.songhealth.foundation.resource: verification.nginx
      org.songhealth.foundation.ownership-schema: v1

  # The production-built application from the accepted release image definition (T045). Its
  # port stays internal to this Compose project; only Nginx may reach it.
  songhealth-app:
    build:
      context: ..
      dockerfile: infra/Containerfile
    image: songhealth-foundation:provisional
    expose:
      - "3000"
    networks:
      - proxy
      - database
    labels:
      org.songhealth.foundation.delivery: "001-application-foundation"
      org.songhealth.foundation.checkout: "${SONGHEALTH_CHECKOUT_ID:?required checkout ownership input is absent}"
      org.songhealth.foundation.environment: development
      org.songhealth.foundation.runtime-profile: verification
      org.songhealth.foundation.operation-target: verification
      org.songhealth.foundation.resource: verification.application
      org.songhealth.foundation.ownership-schema: v1

  # The Verification-only Data Store: same provisional engine family as Development, but a
  # distinct service, credentials, database name, volume, and network.
  songhealth-db:
    image: docker.io/library/mysql@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    command:
      - --character-set-server=utf8mb4
      - --default-storage-engine=innodb
    environment:
      MYSQL_DATABASE: songhealth_verification
      MYSQL_USER: songhealth_ver
      MYSQL_PASSWORD: ver-only-placeholder
      MYSQL_ROOT_PASSWORD: ver-only-placeholder-root
    expose:
      - "3306"
    volumes:
      - database-data:/var/lib/mysql
    networks:
      - database
    labels:
      org.songhealth.foundation.delivery: "001-application-foundation"
      org.songhealth.foundation.checkout: "${SONGHEALTH_CHECKOUT_ID:?required checkout ownership input is absent}"
      org.songhealth.foundation.environment: development
      org.songhealth.foundation.runtime-profile: verification
      org.songhealth.foundation.operation-target: verification
      org.songhealth.foundation.resource: verification.database
      org.songhealth.foundation.ownership-schema: v1

networks:
  # Proxy tier: Nginx to application only. The proxy has no route to the database tier.
  proxy:
    driver: bridge
    labels:
      org.songhealth.foundation.delivery: "001-application-foundation"
      org.songhealth.foundation.checkout: "${SONGHEALTH_CHECKOUT_ID:?required checkout ownership input is absent}"
      org.songhealth.foundation.environment: development
      org.songhealth.foundation.runtime-profile: verification
      org.songhealth.foundation.operation-target: verification
      org.songhealth.foundation.resource: verification.proxy-network
      org.songhealth.foundation.ownership-schema: v1
  # Data tier: application to database only. Never shared with Development.
  database:
    driver: bridge
    labels:
      org.songhealth.foundation.delivery: "001-application-foundation"
      org.songhealth.foundation.checkout: "${SONGHEALTH_CHECKOUT_ID:?required checkout ownership input is absent}"
      org.songhealth.foundation.environment: development
      org.songhealth.foundation.runtime-profile: verification
      org.songhealth.foundation.operation-target: verification
      org.songhealth.foundation.resource: verification.database-network
      org.songhealth.foundation.ownership-schema: v1

volumes:
  # Disposable clean-run Verification data state; removed with its run, never persisted across
  # routine stop/restart like the Development volume.
  database-data:
    labels:
      org.songhealth.foundation.delivery: "001-application-foundation"
      org.songhealth.foundation.checkout: "${SONGHEALTH_CHECKOUT_ID:?required checkout ownership input is absent}"
      org.songhealth.foundation.environment: development
      org.songhealth.foundation.runtime-profile: verification
      org.songhealth.foundation.operation-target: verification
      org.songhealth.foundation.resource: verification.database-volume
      org.songhealth.foundation.ownership-schema: v1
