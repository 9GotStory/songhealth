# Songhealth checks: the production build, typecheck, node tests, the T016 harness's
# self-test, formatting, unused files, dependencies and exports (Knip), duplicated code
# (jscpd, .jscpd.json), ShellCheck on the development-runtime scripts, and the Windows client
# scripts on a Windows runner (job windows-client). They run on every pull request, whatever its
# base, and on every push to main or to a feature's integration branch, named
# <feature number>-<name> such as 004-ita (docs/agents/issue-tracker.md, Branches), so a new
# feature's branch needs no change here (#122 retro). The browser suites need the development
# runtime's database and credentials, so they run there instead (README.md).
name: checks

on:
  pull_request:
  push:
    branches: [main, "[0-9][0-9][0-9]-*"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
      - run: npm install -g npm@12.2.1
      - run: npm ci
      # The build also generates the .astro/ types that typecheck reads. Its
      # inputs are the build-only placeholders in scripts/with-build-inputs.mjs:
      # not secrets, not routable, and the build reaches no database or network.
      - run: npm run build:check
      - run: npm run typecheck
      - run: npm run test:node
      # The T016 lifecycle harness's self-test runs on scratch files and shims, never a
      # deployment; among its cases, the validation picture, the command that makes it
      # and the digest the harness expects agree (#454 retro).
      - run: tests/operations/verify-foundation.sh --self-test
      - run: npm run format:check
      - run: npm run knip
      - run: npm run jscpd
      - run: npm run lint:shell

  # The Windows client scripts on a throwaway Windows runner (#456 retro, Product Owner, #456
  # comment 7182354426): PSScriptAnalyzer's errors, then client.ps1 end to end in Windows
  # PowerShell 5.1, the shell the Product Owner runs it in (scripts/windows/ci-selftest.ps1).
  windows-client:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: PSScriptAnalyzer
        shell: powershell
        run: |
          $module = Get-Module -ListAvailable PSScriptAnalyzer | Sort-Object Version -Descending | Select-Object -First 1
          if (-not $module) { throw 'PSScriptAnalyzer is not on this runner image' }
          Write-Output "PSScriptAnalyzer $($module.Version)"
          $findings = Invoke-ScriptAnalyzer -Path scripts/windows -Recurse -Severity Error, Warning
          $findings | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message | Out-String -Width 200
          if (@($findings | Where-Object Severity -eq 'Error').Count -gt 0) { exit 1 }
      - name: client.ps1 end to end
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows/ci-selftest.ps1
