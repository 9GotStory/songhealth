# Songhealth checks: the production build, typecheck, node tests, formatting, unused
# files, dependencies and exports (Knip), duplicated code (jscpd, .jscpd.json) and
# ShellCheck on the development-runtime scripts, on every pull request into and push
# to main or the Feature 003 integration branch. The browser suites need the
# development runtime's database and credentials, so they run there instead
# (README.md).
name: checks

on:
  pull_request:
    branches: [main, 003-public-website]
  push:
    branches: [main, 003-public-website]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
      - run: npm install -g npm@12.2.1
      - run: npm ci
      # The build also generates the .astro/ types that typecheck reads. Its
      # inputs are the build-only placeholders in scripts/with-build-inputs.mjs:
      # not secrets, not routable, and the build reaches no database or network.
      - run: npm run build:check
      - run: npm run typecheck
      - run: npm run test:node
      - run: npm run format:check
      - run: npm run knip
      - run: npm run jscpd
      - run: npm run lint:shell
